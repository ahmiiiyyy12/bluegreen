<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input</title>
</head>
<body>
    <form style="width: 30vw; height: 50vh; border: 3px solid rgb(105, 234, 25); border-radius: 15px;padding: 20px; margin: 90px auto;" action="">
        <fieldset>
            <legend style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-size: 20px; color: rgb(237, 28, 216);">Personal Information</legend>
            <label style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-size: 20px;" for="">Full Name</label><br>
            <input style="width: 98%;height: 35px; border: 1px solid rgb(0, 0, 0);margin-bottom: 20px; border-radius: 15px;" type="text">

            <label style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-size: 20px;" for="">Email</label><br>
            <input style="width: 98%;height: 35px; border: 1px solid gray;margin-bottom: 20px; border-radius: 15px;" type="email">
            
            <label style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-size: 20px;" for="">Date of birth</label><br>
            <input style="height: 3.5vh;width: 35%;" type="date">
        </fieldset>
        <button type="submit" style="width: 100%;font-size: 20px; height: 40px; border-radius: 15px; margin-top: 40px; border: 0px; background-color: antiquewhite;">Submit</button>
    </form>
</body>
</html>
