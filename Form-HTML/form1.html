<body style="background-color: rgb(131, 255, 127);">
    <form action="" style="border: 2px solid; background-color: rgba(158, 241, 213, 0.478); padding: 20px; width: 30%; height: 80vh; margin:30px auto;border-radius: 15px; " >
        <h2 style="text-align: center; font-size: 40px; color: blue; ">Register</h2>

        <label style="font-size: 25px;" for="">User</label><br>
        <input style="width: 98%; height: 40px;margin-bottom: 15px; border-radius: 15px;border: 1px solid red; font-size: 20px;" type="text">

        <label style="font-size: 25px; " for="">Email</label><br>
        <input style="width: 98%; height: 40px; margin-bottom: 15px; border-radius: 15px;border: 1px solid red; font-size: 20px; " type="email">

        <button style="width: 98%; height: 5.4vh;font-weight: bold; border-radius: 15px;margin-top: 15px; border: 0px;background-color: rgb(238, 241, 166); font-size: 20px;">Facebook</button>


    </form>
