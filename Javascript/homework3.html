<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="container-fluid d-flex">
        <form class="w-75 m-auto border p-3">
            <h1>Input Employee</h1>
            <label class="text-black fs-4 ">ID</label>
            <input type="text " id="id" class="mb-3 w-100 border-1 fs-5 rounded-2">

            <label class="text-black fs-4">Name</label>
            <input type="text " id="name" class="mb-3 w-100 border-1 fs-5 rounded-2">

            <label class="text-black fs-4">Gender</label>
            <input type="text " id="gender" class="mb-3 w-100 border-1 rounded-2 fs-5">

            <label class="text-black fs-4">Position</label>
            <input type="text " id="position" class="mb-3 w-100 border-1 rounded-2 fs-5">

            <label class="text-black fs-4">Salary</label>
            <input type="text " id="salary" class="mb-3 w-100 border-1 rounded-2 fs-5">
                        <br>
            <button type="button" onclick="Employee()" class="btn fs-2 bg-danger shadow">Submit</button>
            <button type="reset" class="btn fs-2 bg-primary shadow">Reset</button>
            
        </form>

        <table class="table table-striped">
            <tr class="fs-4">
                <th>ID</th>
                <th>Name</th>
                <th>Gender</th>
                <th>Position</th>
                <th>Salary</th>
            </tr>
            <tbody id = "employee">
                
            </tbody>
        </table>
    </div>
    <script>
        function Employee(){
            let id = (document.getElementById("id").value);
            let name =(document.getElementById("name").value);
            let gender = (document.getElementById("gender").value);
            let position = (document.getElementById("position").value);
            let salary =(document.getElementById("salary").value);

            document.getElementById("employee").innerHTML += `
            <tr>
                <td>${id}</td>
                <td>${name}</td>
                <td>${gender}</td>
                <td>${position}</td>
                <td>${salary}</td>
            <tr/>
            `
        }
    </script>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
