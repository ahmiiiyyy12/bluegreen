<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condition</title>
</head>
<body>
    <script>
        let name, code;
        let total , dis, qty, payment, price;

        code = prompt("Input code : ");
        name = prompt("Input Name : ");
        qty = prompt("Input Qty : ");
        price =Number(prompt("Input Price : "));
        total = Number(prompt("Input Total : "));

        document.write("Code :" + code +"<br>");
        document.write("Name :" + name +"<br>");
        document.write("Price :" + price +"$<br>");
        document.write("Qty :" + qty +"<br>");
        document.write("Total :" + total +"<br>");

        if(total>=1  && total <= 10){
            document.write("Discount 10%");
            
        }else if(total>=10  && total <= 20){
            document.write("Discount 20%");
            dis = 20;
        }else if(total>=20  && total <= 30){
            document.write("Discount 30%");
            dis = 30;
        }else if(total>=30  && total <= 40){
            document.write("Discount 40%");
            dis = 40;
        }else if(total>=40  && total <= 50){
            document.write("Discount 50%");
            dis = 50;
        }else if(total>=50  && total <= 60){
            document.write("Discount 60%");
            dis = 60;
        }else{
            document.write("Discount 70%");
            dis = 70;
        }

        payment = price*dis/100;
        document.write("<br>Payment :" + payment +"$<br>");

    </script>
</body>
</html>
