<body>

    <script>
        // let name = "Martin";

        let num1, num2;

        num1 = Number(prompt("Input Number1 : "));
        num2 = Number(prompt("Input Number2 : "));

        document.write("Number1 = " +num1+"<br>");
        document.write("Number2 = " +num2+"<br>");

        document.write("Num1 + Num2 = "+(num1+num2)+"<br>");
        document.write("Num1 - Num2 = "+(num1-num2)+"<br>");
        document.write("Num1 * Num2 = "+(num1*num2)+"<br>");
        document.write("Num1 / Num2 = "+(num1/num2)+"<br>");

    </script>
    
</body>
