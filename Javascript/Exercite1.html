<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="container-fluid d-flex">
        <form class="w-100 m-auto border p-3">
            <h1>តារាងគ្របើគ្រប់គ្រង់ពិន្ទុ</h1>
            <label class="text-black fs-4 ">ID</label>
            <input type="text " id="id" class="mb-3 w-100 border-1 fs-5 rounded-2">

            <label class="text-black fs-4 ">Name</label>
            <input type="text " id="name" class="mb-3 w-100 border-1 fs-5 rounded-2">

            <label class="text-black fs-4">Year</label>
            <input type="text " id="year" class="mb-3 w-100 border-1 fs-5 rounded-2">

            <label class="text-black fs-4">Room</label>
            <input type="text " id="room" class="mb-3 w-100 border-1 rounded-2 fs-5">

            <label class="text-black fs-4">Score1</label>
            <input type="text " id="score1" class="mb-3 w-100 border-1 rounded-2 fs-5">

            <label class="text-black fs-4">Score2</label>
            <input type="text " id="score2" class="mb-3 w-100 border-1 rounded-2 fs-5">

            <label class="text-black fs-4">Score3</label>
            <input type="text " id="score3" class="mb-3 w-100 border-1 rounded-2 fs-5">

            <label class="text-black fs-4">Score4</label>
            <input type="text " id="score4" class="mb-3 w-100 border-1 rounded-2 fs-5">



            <div class="text-center p-2 ">
                <button type="button" onclick="Student()" class="btn w-25 fs-2 bg-danger shadow">Submit</button>
                <button type="reset" class="btn fs-2 bg-primary w-25 shadow">Reset</button>
            </div>
            
        </form>
        <div id="student"></div>
    </div><br><br>
        
                    

    <script>
        function Student(){
            let id = (document.getElementById("id").value);
            let name =(document.getElementById("name").value);
            let year =Number (document.getElementById("year").value);
            let room = (document.getElementById("room").value);
            let score1 =Number(document.getElementById("score1").value);
            let score2 =Number(document.getElementById("score2").value);
            let score3 =Number(document.getElementById("score3").value);
            let score4 =Number(document.getElementById("score4").value);
            let total = score1 + score2 + score3 + score4;
            let average = total/4;
            let grand ="";

            if(average>=1  && average < 50){
                grand = F;
            }else if(total>=50  && total < 60){
                grand = E;
            }else if(total>=60  && total < 70){
                grand = D;
            }else if(total>=70  && total < 80){
                grand = C;
            }else if(total>=80  && total < 90){
                grand = B;
            }else if(total>=90  && total <= 100){
                grand = A;
            }




            document.getElementById("student").innerHTML += `
            <div>
                <table>
                    <h3 >ឈ្មោះសិស្ស​​ : ${name}  ​ឆ្នាំទី​ : ${year} បន្ទប់លខ: ${room} </h3><br/>
    
                    <table class="table table-striped">
                      <thead>
                        <tr class="fs-4">
                            <th>លេខរៀង</th>
                            <th>HTML</th>
                            <th>CSS</th>
                            <th>JAVA</th>
                            <th>Bootsrapt</th>
                            <th>ពិន្ទុសរុប</th>
                            <th>Average</th>
                            <th>និទ្ទេស</th>
                        </tr>
                      </thead>

                        <tbody>
                          <tr>
                            <td>${id}</td>
                            <td>${score1}</td>
                            <td>${score2}</td>
                            <td>${score3}</td>
                            <td>${score4}</td>
                            <td>${total}</td>
                            <td>${average}</td>
                            <td>${grand}</td>
                          </tr>
                        </tbody>
                    
                    </table>
                
                </table>

            </div>
            `
        }
    </script>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
