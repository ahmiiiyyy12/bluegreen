<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let id, age;
        let name, gender, position;
        let rat, hour, salary, total_salary;

        id = prompt("Input ID : ");
        name = prompt("Input Name : ");
        age = prompt("Input Age : ");
        gender = prompt("Input Gender : ");
        position = prompt("Input Position : ");
        rat = prompt("Input Rat : ");
        hour = prompt("Input Hour : ");
        salary = Number(prompt("Input Salary : "));

        total_salary = (salary + (rat*hour));

        document.write("ID : " + id +"<br>");
        document.write("Name : " + name +"<br>");
        document.write("Age : " + age +"<br>");
        document.write("Gender : " + gender +"<br>");
        document.write("Position : " + position +"<br>");
        document.write("Rat : " + rat +"$<br>");
        document.write("Hour : " + hour +"h<br>");
        document.write("Salary :" + salary +"$<br>");
        document.write("Total Salary :" + total_salary +"$<br>");


    </script>
</body>
</html>
