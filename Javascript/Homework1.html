<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="container-fluid d-flex">
        <form class="w-75 m-auto border p-3">
            <h1>Input information of Student</h1>
            <label class="text-black fs-3">ID</label>
            <input type="text" id="ID" class="mb-3 w-100 border-1 fs-5 rounded-2">

            <label class="text-black fs-3">Name</label>
            <input type="text" id="name" class="mb-3 w-100 border-1 fs-5 rounded-2">

            <label class="text-black fs-3">Age</label>
            <input type="text" id="age" class="mb-3 w-100 border-1 fs-5 rounded-2">

            <label class="text-black fs-3">Gender</label>
            <input type="text" id="gender" class="mb-3 w-100 border-1 fs-5 rounded-2">

            <label class="text-black fs-3">Grand</label>
            <input type="text" id="grand" class="mb-3 w-100 border-1 fs-5 rounded-2">

            <button type="button" onclick="Student()" class="btn fs-3 shadow">Submit</button>
            <button type="reset" class="btn fs-3">Reset</button>
        </form>

        <table class="table table-responsive">
            <tr class="fs-3">
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Grand</th>
            </tr>
            <tbody id="student"></tbody>
        </table>
    </div> 

        <script>
            function Student(){
                let id =Number(document.getElementById("id").value);
                let name = Number(document.getElementById("id").value);
                let age =Number (document.getElementById("id").value);
                let gender =Number(document.getElementById("id").value);
                let grand =Number(document.getElementById("id").value);

                document.getElementById("student") += `
                <tr>
                    <td>${id}</td>
                    <td>${name}</td>
                    <td>${age}</td>
                    <td>${gender}</td>
                    <td>${grand}</td>
                <tr/>
                `
            }
        </script>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
