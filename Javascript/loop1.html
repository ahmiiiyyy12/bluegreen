<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="card-body w-50 m-auto shadow p-3">
        <h2>Enter number of loop</h2>
        <input id="num" class="fs-2 h1 rounded-4 border-1" type="text"><br>
        <button type="button" onclick="Loop()"  class="btn bg-primary rounded-4 text-light">Submit</button>

    </div>
    <div class="card w-25 shadow m-auto overflow-hidden">
        <p class="object-fit-cover text-black p-4 rounded-3" id="loop"> </p>

    </div>

    <script>
        function Loop(){
            let num = Number(document.getElementById("num").value);
            let sum = 1, sum1=1;
            let mul = 1, mul1=1;
            for(let i=2; i<=num ; i++){

                mul1 = mul1+"x"+i;
                sum1 = sum1 + " + "+ mul1;

                mul = mul*i;
                sum = sum + mul;

                document.getElementById("loop").innerHTML ="c).  "+sum1+" = "+ sum;

            }
        }
    </script>
    
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
